services:
  debugging_demo:
    container_name: debugging_demo
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    ports:
      - "${DEBUGGING_DEMO_PORT:-8081}:8080"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    restart: unless-stopped
